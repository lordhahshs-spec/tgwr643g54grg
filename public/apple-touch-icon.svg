<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1c"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D287"/>
      <stop offset="100%" stop-color="#00b875"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.35"/>

  <!-- CellHub Monogram Icon -->
  <g transform="translate(100, 100) scale(2.44)">
    <!-- Outer E shape -->
    <path d="M50 24 C28 24 14 38 14 64 C14 90 28 104 50 104 L94 104 L94 89 L50 89 C36 89 29 80 29 64 C29 48 36 39 50 39 L94 39 L94 24 Z" fill="#FFFFFF"/>
    <!-- Middle horizontal bar with green gradient -->
    <rect x="25" y="57" width="69" height="14" rx="2" fill="url(#accentGrad)" filter="url(#glow)"/>
    <!-- Vertical bar on the right -->
    <rect x="99" y="24" width="15" height="80" rx="3" fill="#FFFFFF"/>
  </g>
</svg>
